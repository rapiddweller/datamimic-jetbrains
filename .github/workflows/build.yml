# Every push and pull request: test and build the plugin ZIP (downloadable from the run).
# A version tag (v0.1.0) is the plugin version: the build uses it, runs the Plugin Verifier, and publishes a GitHub
# release with the ZIP and the version's section of CHANGELOG.md.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Take the version from the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not v<major>.<minor>.<patch>"
            exit 1
          fi
          if ! grep -qxF "## [$version]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section '## [$version]'"
            exit 1
          fi
          echo "VERSION_ARG=-Pversion=$version" >> "$GITHUB_ENV"

      - name: Test and build the plugin
        run: ./gradlew $VERSION_ARG test buildPlugin verifyPluginStructure verifyPluginProjectConfiguration

      # WHY: only for releases; it downloads several IDE versions (about 4 GB) to check compatibility.
      - name: Verify compatibility with current and upcoming IDEs
        if: startsWith(github.ref, 'refs/tags/')
        run: ./gradlew $VERSION_ARG verifyPlugin

      - uses: actions/upload-artifact@v7
        with:
          name: datamimic-plugin
          path: build/distributions/*.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: reports
          path: |
            build/reports/tests
            build/reports/pluginVerifier

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: datamimic-plugin
          path: dist

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The release notes are the version's section of CHANGELOG.md.
          awk -v heading="## [$version]" '$0 == heading {found = 1; next} found && /^## \[/ {exit} found' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/*.zip --title "DATAMIMIC $version" --notes-file notes.md
