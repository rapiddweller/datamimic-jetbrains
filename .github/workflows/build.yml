# Pull requests, pushes to main, and version tags: test and build a versioned plugin ZIP (downloadable from the run).
# A version tag (v0.1.0) is the exact plugin version. Other builds derive a SemVer pre-release from the latest tag
# and GitHub run number. Tag builds run the Plugin Verifier and publish the ZIP with that CHANGELOG section.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Derive the plugin version
        run: |
          ./scripts/plugin-version.sh test
          version="$(./scripts/plugin-version.sh)"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::Tag $GITHUB_REF_NAME does not point at a commit merged into main"
              exit 1
            fi
            if ! grep -qxF "## [$version]" CHANGELOG.md; then
              echo "::error::CHANGELOG.md has no section '## [$version]'"
              exit 1
            fi
          fi
          echo "VERSION_ARG=-Pversion=$version" >> "$GITHUB_ENV"

      - name: Test and build the plugin
        run: ./gradlew $VERSION_ARG test buildPlugin verifyPluginStructure verifyPluginProjectConfiguration

      # GitHub wraps uploaded files in another ZIP. Upload the unpacked distribution so the downloaded artifact
      # itself has the plugin root at its top level and works with "Install Plugin from Disk".
      - name: Prepare the installable development artifact
        run: |
          mkdir -p build/actions-plugin
          unzip -q build/distributions/*.zip -d build/actions-plugin
          plugin_jar="$(find build/actions-plugin -path '*/lib/datamimic-*.jar' -type f -print -quit)"
          test -n "$plugin_jar"
          unzip -p "$plugin_jar" META-INF/plugin.xml | grep -q '<id>com.rapiddweller.datamimic</id>'

      # WHY: only for releases; it downloads several IDE versions (about 4 GB) to check compatibility.
      - name: Verify compatibility with current and upcoming IDEs
        if: startsWith(github.ref, 'refs/tags/')
        run: ./gradlew $VERSION_ARG verifyPlugin

      - uses: actions/upload-artifact@v7
        with:
          name: datamimic-plugin
          path: build/actions-plugin
          if-no-files-found: error

      # Tagged releases need the original versioned Gradle distribution as their GitHub release asset.
      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: datamimic-release-archive
          path: build/distributions/*.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: reports
          path: |
            build/reports/tests
            build/reports/pluginVerifier

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: datamimic-release-archive
          path: dist

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The release notes are the version's section of CHANGELOG.md.
          awk -v heading="## [$version]" '$0 == heading {found = 1; next} found && /^## \[/ {exit} found' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md section '## [$version]' has no release notes"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" dist/*.zip --title "DATAMIMIC $version" --notes-file notes.md
