# Every push and pull request: test and build the plugin ZIP (downloadable from the run).
# A version tag (v0.1.0): additionally run the Plugin Verifier and publish a GitHub release with the ZIP.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Test and build the plugin
        run: ./gradlew test buildPlugin verifyPluginStructure verifyPluginProjectConfiguration

      - name: Check that the tag matches the plugin version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^version *= *//p' gradle.properties)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in gradle.properties"
            exit 1
          fi

      # WHY: only for releases; it downloads several IDE versions (about 4 GB) to check compatibility.
      - name: Verify compatibility with current and upcoming IDEs
        if: startsWith(github.ref, 'refs/tags/')
        run: ./gradlew verifyPlugin

      - uses: actions/upload-artifact@v7
        with:
          name: datamimic-plugin
          path: build/distributions/*.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: reports
          path: |
            build/reports/tests
            build/reports/pluginVerifier

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: datamimic-plugin
          path: dist

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The release notes are the version's section of CHANGELOG.md.
          awk -v heading="## [$version]" '$0 == heading {found = 1; next} found && /^## \[/ {exit} found' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/*.zip --title "DATAMIMIC $version" --notes-file notes.md
